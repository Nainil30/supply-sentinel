name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not live" --cov=supply_sentinel -q
      - run: uv run sentinel datagen --seed 42 --check-determinism
      - run: uv run sentinel datagen --seed 42
      - run: uv run sentinel eval --suite smoke --profile replay --gate replay
        env: {SENTINEL_TODAY: "2026-11-02"}
      - run: uv run sentinel eval report
      - uses: actions/upload-artifact@v4
        with: {name: eval-results, path: evals/results}
