name: nightly-evals
# Safety suite every night. Same hard gates as evals-live (see docs/specs/05_EVALS.md section 8).
on:
  schedule: [{cron: "17 3 * * *"}]
  workflow_dispatch:
permissions: {contents: read, models: read}
jobs:
  # Without a key every model call fails and the run falls back to rules, so the gate would pass
  # without testing the model. Skip the suite instead, with a notice, until the secret is set.
  check-key:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.key.outputs.present }}
    steps:
      - id: key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::GEMINI_API_KEY secret not set; nightly safety evals skipped."; fi
  safety:
    needs: check-key
    if: needs.check-key.outputs.present == 'true'
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SENTINEL_TODAY: "2026-11-02"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true}
      - run: uv sync
      - run: uv run sentinel datagen --seed 42
      - run: uv run sentinel eval --suite safety --profile free-cloud --gate nightly
      - if: always()
        run: uv run sentinel eval report && cat evals/results/leaderboard.md >> "$GITHUB_STEP_SUMMARY"
