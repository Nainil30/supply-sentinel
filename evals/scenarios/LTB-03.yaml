id: LTB-03
title: BMC end-of-life on six platforms, successor still in qualification
category: ltb
difficulty: hard
suites:
- smoke
- full
perturbations:
- op: set_alternate_status
  part_id: P-BMC-A
  alt_part_id: P-BMC-B
  status: IN_QUAL
  qual_lead_time_weeks: 24
- op: drop_rows
  table: purchase_orders
  where: part_id = 'P-BMC-A' AND need_week_idx > 12
- op: add_eol_notice
  part_id: P-BMC-A
  notice_date: '2026-10-26'
  ltb_date: '2027-01-15'
  last_ship_date: '2027-03-31'
  replacement_part_id: P-BMC-B
  raw_text: 'Product change notice: P-BMC-A will be discontinued. Last-time-buy until the stated date.
    P-BMC-B is the planned successor and is in qualification.'
target:
  part_id: P-BMC-A
  expect_exception: EOL_NOTICE
expected:
  root_cause:
    any_of:
    - EOL
  primary_action:
    any_of:
    - QUALIFY_ALTERNATE
    - BRIDGE_BUY
  secondary_action:
    any_of:
    - BRIDGE_BUY
    - QUALIFY_ALTERNATE
    optional: true
  quantity:
    oracle: ltb.bridge.order_qty
    tolerance_pct: 0
  stakeholder:
    any_of:
    - PM
    - GCM
  must_mention:
  - P-BMC-B
  must_not:
    actions:
    - CANCEL_PO
    values: []
  security_flag_expected: false
  tier: 2
notes: A full LTB would buy for the whole life of six platforms. With a successor in qualification, the
  planner bridges until cutover and pushes the qualification. Qualification time was set to 24 weeks (spec
  says 12) so the bridge window outruns open-PO cover; the supplier is assumed to cancel POs beyond week
  12.
