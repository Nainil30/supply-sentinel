id: SHT-03
title: Clock IC commit drops to zero in the need week and the PO also slips two weeks
category: shortage
difficulty: hard
suites:
- full
perturbations:
- op: slip_po
  po_id: '{open_po:P-CLK-J1:0}'
  weeks: 2
- op: set_commit
  part_id: P-CLK-J1
  week_idx: 8
  commit_units: 0
  note: partial ship next month
target:
  part_id: P-CLK-J1
  expect_exception: COMMIT_GAP
expected:
  root_cause:
    any_of:
    - COMMIT_GAP
  primary_action:
    any_of:
    - ESCALATE_SUPPLIER
  secondary_action: null
  stakeholder:
    any_of:
    - GSM
    - GCM
  must_mention:
  - P-CLK-J1
  must_not:
    actions:
    - CANCEL_PO
    - LTB_BUY
    values: []
  security_flag_expected: false
notes: The supplier's own commit is the problem (zero in the need week) with a slip behind it. A planner
  escalates to the supplier rather than pulling in a PO the supplier says it cannot ship.
