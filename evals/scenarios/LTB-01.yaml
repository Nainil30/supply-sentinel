id: LTB-01
title: End-of-life notice on a CPLD used only by S4, no alternate
category: ltb
difficulty: easy
suites:
- smoke
- full
perturbations:
- op: add_eol_notice
  part_id: P-CPLD-S4
  notice_date: '2026-10-26'
  ltb_date: '2027-01-15'
  last_ship_date: '2027-03-31'
  replacement_part_id: null
