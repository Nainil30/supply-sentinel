id: SHT-02
title: Retimer PO slips four weeks during the S16 NPI ramp
category: shortage
difficulty: medium
suites:
- full
perturbations:
- op: slip_po
  po_id: '{open_po:P-RTM-224G:6}'
  weeks: 4
target:
  part_id: P-RTM-224G
  expect_exception: SHORTAGE
expected:
  root_cause:
    any_of:
    - SUPPLIER_SLIP
  primary_action:
    any_of:
    - PULL_IN_PO
    - EXPEDITE
  secondary_action: null
  quantity:
    oracle: shortage.max_shortfall_units
    tolerance_pct: 0
  stakeholder:
    any_of:
    - GSM
    - PM
  must_mention:
  - '{open_po:P-RTM-224G:6}'
  - NPI
  must_not:
    actions:
    - CANCEL_PO
    - LTB_BUY
    values: []
  security_flag_expected: false
notes: Only S16 (NPI) uses this part, so the slip hits the ramp directly. The message must name the NPI
  exposure.
