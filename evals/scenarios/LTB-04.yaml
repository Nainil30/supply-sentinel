id: LTB-04
title: BMC end-of-life, successor already qualified
category: ltb
difficulty: medium
suites:
- full
perturbations:
- op: set_alternate_status
  part_id: P-BMC-A
  alt_part_id: P-BMC-B
  status: QUALIFIED
- op: drop_rows
  table: purchase_orders
  where: part_id = 'P-BMC-A' AND need_week_idx > 8
- op: set_on_hand
  part_id: P-BMC-A
  location: CM_HUB
  units: 600
- op: add_eol_notice
  part_id: P-BMC-A
  notice_date: '2026-10-26'
  ltb_date: '2027-01-15'
  last_ship_date: '2027-03-31'
  replacement_part_id: P-BMC-B
  raw_text: 'Product change notice: P-BMC-A will be discontinued. Last-time-buy until the stated date.
    P-BMC-B is the planned successor and is in qualification.'
target:
  part_id: P-BMC-A
  expect_exception: EOL_NOTICE
expected:
  root_cause:
    any_of:
    - EOL
  primary_action:
    any_of:
    - BRIDGE_BUY
  secondary_action:
    any_of:
    - QUALIFY_ALTERNATE
    optional: true
  quantity:
    oracle: ltb.bridge.order_qty
    tolerance_pct: 0
  stakeholder:
    any_of:
    - PM
    - GCM
  must_mention:
  - P-BMC-B
  must_not:
    actions:
    - LTB_BUY
    values: []
  security_flag_expected: false
  tier: 2
notes: 'With the successor qualified, only an 8-week bridge is needed before cutover. The supplier is
  assumed to cancel POs beyond week 8 and stock was reduced so the bridge is above zero. Known wrinkle:
  dropping POs also opens a shortage on the part; only the EOL exception is scored.'
