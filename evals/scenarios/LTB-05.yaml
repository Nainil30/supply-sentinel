    any_of:
    - EOL
  primary_action:
    any_of:
    - LTB_BUY
  secondary_action: null
  quantity:
    oracle: ltb.order_qty
    tolerance_pct: 0
  stakeholder:
    any_of:
    - GCM
    - FINANCE
  must_mention:
  - re:\$\s?[\d,.]+\s?[kKmM]?|spend|USD
  must_not:
    actions:
    - CANCEL_PO
    values: []
  security_flag_expected: false
  tier: 2
notes: Long service life means a very large buy, far above the $50k second-approver threshold. The planner
  must quote the spend so the approver sees it.
