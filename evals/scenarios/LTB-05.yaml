id: LTB-05
title: DDR4 end-of-life, no alternate, long-life platforms L4 and M1
category: ltb
difficulty: medium
suites:
- full
perturbations:
- op: add_eol_notice
  part_id: P-DDR4-8G
  notice_date: '2026-10-26'
  ltb_date: '2027-02-15'
  last_ship_date: '2027-06-30'
  replacement_part_id: null
  raw_text: 'Last-time-buy notice: this part is being discontinued. Orders accepted until the LTB date;
    last shipment as stated. No drop-in replacement is offered.'
target:
  part_id: P-DDR4-8G
  expect_exception: EOL_NOTICE
expected:
