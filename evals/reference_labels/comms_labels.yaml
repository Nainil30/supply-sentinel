# Reference labels for the message judge (spec 05 section 5).
# labeler: ai-reference  -> labelled by a second model from the rubric alone. PROVISIONAL.
# The owner re-labels the same 15 messages into evals/human_labels/comms_labels.yaml.
# Messages are hand-written drafts (good and weak on purpose), not yet taken from real runs.
labeler: ai-reference
rubric: |
  1 bottom_line_first: the ask is in the first sentence.
  2 right_audience: content fits the stakeholder (GSM supplier action, GCM commodity/$,
    PM customer/allocation impact, FINANCE exposure/reserve, QUALITY hold disposition).
  3 numbers_consistent: quantity, date or week, and $ where relevant are present and agree with facts.
  4 decision_and_deadline: a clear decision is requested and a deadline is stated.
  5 concise_professional: at most 150 words, professional.
items:
  - id: M-01
    stakeholder: GSM
    facts: {part_id: P-PSU-3000AC, action: PULL_IN_PO, quantity: 150, target_week_idx: 16}
    message: "Please pull in the late P-PSU-3000AC purchase order so 150 units land by week 16. The part is 150 units short from week 16 after a 3-week slip. Can you confirm a new ship date by Friday?"
    labels: {bottom_line_first: true, right_audience: true, numbers_consistent: true, decision_and_deadline: true, concise_professional: true}
