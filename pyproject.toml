[project]
name = "supply-sentinel"
version = "0.0.1"
description = "Agentic supply-execution copilot on synthetic data for a fictional OEM."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "typer>=0.27",
  "pydantic>=2.14",
  "pyyaml>=6.0",
  "duckdb>=2.0",
  "numpy>=2.0",
  "mcp==2.3.0",
  "langgraph>=1.2",
  "langgraph-checkpoint-sqlite>=3.1",
  "langchain>=1.4",
  "langchain-core>=1.7",
  "langchain-ollama>=1.1",
  "langchain-openai>=1.7",
  "streamlit>=1.40",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  "openinference-instrumentation-langchain>=0.1.40",
  "openai>=3.39",
]

[project.scripts]
sentinel = "supply_sentinel.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "hypothesis>=6.170.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supply_sentinel"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["supply_sentinel.engine.*", "supply_sentinel.evals.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs network or a live LLM; excluded from CI by default"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # long SQL strings read better unbroken
"src/supply_sentinel/agent/**" = ["E501"]  # prompt text and validator messages read better unbroken
