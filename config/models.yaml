# Profiles. Model ids for `local` mirror config/models.local.yaml (what is installed here).
profiles:
  free-cloud:
    # Gemini API free tier through its OpenAI-compatible endpoint (GitHub Models was retired 2026-07-30).
    # Key: Google AI Studio, no billing; set GEMINI_API_KEY in .env. See docs/adr/0014.
    provider: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    roles:
      specialist: {model: "gemini-3.5-flash", temperature: 0.1}
      extractor:  {model: "gemini-3.5-flash", temperature: 0}
      writer:     {model: "gemini-3.5-flash", temperature: 0.3}
      judge:      {model: "gemini-3.5-flash-lite", temperature: 0}
    limits: {rpm: 8, concurrency: 1, max_input_tokens: 7000, max_output_tokens: 1500}
  local:
    provider: ollama
    base_url: http://localhost:11434
    roles:
      specialist: {model: "qwen3:8b", temperature: 0.1}
      extractor:  {model: "qwen3:8b", temperature: 0}
      writer:     {model: "qwen3:8b", temperature: 0.3}
      judge:      {model: "gemma4:e4b", temperature: 0}
    limits: {concurrency: 1, max_input_tokens: 7000, max_output_tokens: 1500, specialist_wall_seconds: 900}
  premium:       # optional, never required
    provider: anthropic
    api_key_env: ANTHROPIC_API_KEY
    roles: {specialist: {model: "claude-sonnet-5-5"}, writer: {model: "claude-haiku-5-5"}}
  replay:
    source_profile: local   # replay the responses recorded with this profile
    cassette_dir: evals/cassettes
price_table_usd_per_mtok: {}   # fill only for paid profiles; free profiles report $0
